[package]
name = "portal-bsp-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "0.19"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.27"
png = "0.17"
winit = "0.29"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
rayon = "1.10"

[profile.dev]
debug = 0
incremental = false
