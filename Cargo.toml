[package]
name = "openSOURCE"
version = "0.1.0"
edition = "2021"

[lib]
name = "opensource"
crate-type = ["rlib", "cdylib"]

[dependencies]
wgpu = "0.19"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.27"
png = "0.17"
winit = "0.29"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
rayon = "1.10"
rapier3d = "0.36.1"
rodio = { version = "0.20.1", default-features = false, features = ["symphonia-wav", "symphonia-mp3"] }
egui = "0.27"
egui-wgpu = "0.27"
egui-winit = { version = "0.27", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = "0.27"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "0.19", features = ["webgl"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-time = "1"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "HtmlCanvasElement", "Response", "console"] }
rodio = { version = "0.20.1", default-features = false, features = ["wasm-bindgen"] }

[profile.dev]
# Keep real debug builds (symbols and assertions), but optimize simulation math.
opt-level = 1
debug = 1
debug-assertions = true
overflow-checks = true
incremental = true

[profile.dev.package."*"]
opt-level = 2
