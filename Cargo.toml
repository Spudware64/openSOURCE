[package]
name = "openSOURCE"
version = "0.1.0"
edition = "2021"

[lib]
name = "opensource"

[dependencies]
wgpu = "0.19"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.27"
png = "0.17"
winit = "0.29"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
rayon = "1.10"
rapier3d = "0.36.1"
rodio = { version = "0.20.1", default-features = false, features = ["symphonia-wav", "symphonia-mp3"] }

[profile.dev]
# Keep real debug builds (symbols and assertions), but optimize simulation math.
opt-level = 1
debug = 1
debug-assertions = true
overflow-checks = true
incremental = true

[profile.dev.package."*"]
opt-level = 2
